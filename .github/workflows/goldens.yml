name: Goldens

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  goldens:
    name: Goldens match the engine
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "lts/*"
          package-manager-cache: false

      # The goldens are the C port's reference. If the JavaScript engine
      # changes, they must be re-captured deliberately and the diff reviewed --
      # never updated as a side effect of another change.
      - name: goldens match a fresh capture
        run: node tools/goldens.mjs --check

      # A corpus that cannot fail is worse than no corpus. This mutates the
      # engine one constant at a time and requires each to be caught.
      - name: the corpus can fail
        run: bash tools/golden-mutations.sh

  stages:
    name: Stages -- the C against the JavaScript
    runs-on: ubuntu-latest
    # A mutation suite that hangs would otherwise sit here for six hours.
    # Stage 6 renders the whole corpus per mutation, so this job is the one
    # with a run time worth bounding.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "lts/*"
          package-manager-cache: false

      # gcc is the third leg of the stage 6 exit test and is not installed on
      # the development machine, so CI is where it actually gets exercised.
      - name: build (gcc)
        run: |
          cc --version
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      # The text front end is measured against two word lists that are
      # never checked in: the CMU dictionary (the optional dependency
      # upstream's pronounce.js already names) and the Hunspell en_US list.
      # Pinned to the versions goldens/text/*.json were captured from; a
      # different version fails the check by name rather than by count.
      # --no-save: package.json is upstream's and stays as it is.
      - name: install the text front end's measurement inputs
        run: npm install --no-save --no-package-lock cmu-pronouncing-dictionary@3.0.0 dictionary-en@4.0.0

      - name: stage exit tests
        run: ctest --test-dir build --output-on-failure

      # A comparison that has never been seen to fail is one nobody should
      # trust. Both mutation suites corrupt the thing under test and require
      # the check to notice.
      - name: the bank comparison can fail
        run: bash tools/stage2-mutations.sh build

      # The stage 3 suite is the one that matters most and the one that has
      # only ever run on the development machine. Its mutations are logic --
      # the drain order, which parameters get a fresh increment, what
      # tilt_prev holds -- rather than constants, and one of them caught a
      # real mechanical-translation error. Running it here puts it against a
      # second libm as well as a second compiler.
      - name: the sample-loop comparison can fail
        run: python3 tools/stage3-mutations.py build

      # Stage 4 is Tier 1 -- no tolerance -- so a disagreement here is a bug
      # rather than a libm difference. Running it on Ubuntu gcc puts the
      # tokenizer against a second C runtime, and the normalization half
      # against a second build of the same generated table.
      - name: the tokenizer comparison can fail
        run: python3 tools/stage4-mutations.py build

      # Stage 5 is the highest-risk stage in the plan: the largest
      # translation, and the only one where a difference is a logic difference
      # rather than a numeric one. Its verifier passed on the first run, so
      # this suite is what decides whether that meant the translation was
      # right or the comparison was blind.
      - name: the compiler comparison can fail
        run: python3 tools/stage5-mutations.py build

      # Stage 6 renders the corpus to whole WAV files, so each mutation costs
      # a full render. CI runs the 48 kHz leg only; the exit test itself --
      # all three sample rates, run by ctest above -- is unaffected, and the
      # three-rate mutation run is done on the development machine. Every
      # mutation here is caught at 48 kHz as well, which is the point of
      # bounding the rate rather than dropping mutations.
      - name: the encoder comparison can fail
        run: python3 tools/stage6-mutations.py build --rate 48000

      # The text front end's checks passed on their first run too. Five of
      # its stress mutations are caught only by the dictionary measurement,
      # which is why the dictionary is installed above rather than skipped.
      - name: the text front end's checks can fail
        run: python3 tools/text-mutations.py build
