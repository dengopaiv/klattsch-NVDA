name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  banks:
    name: Generated banks are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "lts/*"
          package-manager-cache: false

      # src/engine/banks/bundled.js is generated from the JSON banks beside it
      # and is committed, so it can drift from its source without anything
      # noticing. The C rewrite generates its banks from the same JSON, which
      # means a drift here would surface later as an apparent porting bug.
      - name: bundled.js matches src/engine/banks/*.json
        run: node tools/build-banks.js --check
